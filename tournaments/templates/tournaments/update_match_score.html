{% extends 'tournaments/base.html' %}

{% block content %}
<div class="card">
    <h2>Enter Match Score</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Score
        </button>
    </form>

    <br>
    <a href="/tournaments/{{ match.tournament.id }}/">
        Back to Tournament
    </a>
</div>
{% endblock %}
