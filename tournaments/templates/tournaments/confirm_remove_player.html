{% extends 'tournaments/base.html' %}

{% block title %}Remove Player | VolleyIQ{% endblock %}

{% block content %}
<div class = "card form-card" style = "text-align:center;">
    <h2>Remove Player</h2>
    <p>Are you sure you want to remove
        <strong>{{membership.player.get_full_name|default:membership.player.username}}</strong>
        from <strong>{{team.name}}</strong>?
    </p>

    <form method = "post">
        {% csrf_token %}
        <div class = "form-actions" style = "justify-content:center;">
            <button type = "submit" class = "btn btn-accent" style = "background:#c0392b;">
                Yes, Remove
            </button>
            <a href = "/teams/{{team.id}}/" class = "btn btn-outline">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
