{% extends 'tournaments/base.html' %}

{% block title %}Assign Coach | VolleyIQ{% endblock %}

{% block content %}
<div class = "card form-card">
    <h2>Assign Coach - {{team.name}}</h2>
    <p class = "small-text">Select a coach from users in the Coach group.</p>

    <form method = "post">
        {% csrf_token %}
        {{form.as_p}}

        <div class = "form-actions">
            <button type = "submit" class = "btn btn-accent">Save</button>
            <a href = "/teams/{{team.id}}/" class = "btn btn-outline">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
