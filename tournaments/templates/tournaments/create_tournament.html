{% extends 'tournaments/base.html' %}

{% block title %}Create Tournament{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Create Tournament</h2>
    <p class="small-text">Enter the tournament details below.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-accent">Save Tournament</button>
            <a href="/" class="btn btn-outline">Back Home</a>
        </div>
    </form>
</div>
{% endblock %}
